# Keeps the operator data current and publishes the site to GitHub Pages.
#
# - Every hour: reads the game data's version number (a 38-byte file). If it's the same
#   version the site already has, it stops there. If the version changed (a game patch),
#   it downloads the full game data, and if the recruitable operators or their tags
#   changed, commits the new index.html and redeploys.
# - Once a day: a full rebuild regardless of version, as a safety net.
# - On every push to main: deploys the site.
# - Can also be run by hand: Actions tab -> "Update data and deploy" -> Run workflow.
#
# If the game data format ever changes, build-data.mjs fails instead of writing bad data,
# this run fails, and GitHub emails you. The live site keeps the last good data.

name: Update data and deploy

on:
  schedule:
    - cron: "23 * * * *"   # hourly: quick version check
    - cron: "41 4 * * *"   # daily: full rebuild
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the updated index.html
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new game data version
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          latest=$(curl -fsSL https://raw.githubusercontent.com/ArknightsAssets/ArknightsGamedata/master/en/gamedata/excel/data_version.txt | sed -n 's/.*VersionControl:\([^[:space:]]*\).*/\1/p' || true)
          current=$(grep -o '"version":"[^"]*"' index.html | head -1 | cut -d'"' -f4)
          echo "Site has $current, latest game data is ${latest:-unknown}"
          if [ "$EVENT" = "schedule" ] && [ "$CRON" = "23 * * * *" ] && [ -n "$latest" ] && [ "$latest" = "$current" ]; then
            echo "Same version, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Rebuild operator data from the latest game data
        id: build
        if: steps.check.outputs.skip != 'true'
        run: node build-data.mjs

      - name: Commit updated data
        if: steps.build.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.build.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update operator data: $SUMMARY"
          git push

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.build.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare site
        if: steps.decide.outputs.deploy == 'true'
        run: mkdir _site && cp index.html _site/

      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
